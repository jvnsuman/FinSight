name: CI - Backend & Frontend Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend (FastAPI) - Lint & Compile Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Create dummy config.py for import checks
        working-directory: backend
        run: |
          cat > config.py << 'EOF'
          import os

          DATABASE_URL = "postgresql://ci_user:ci_password@localhost:5432/finsight_ci"
          SECRET_KEY = "ci-dummy-secret-key"
          JWT_SECRET_KEY = "ci-dummy-secret-key"
          ALGORITHM = "HS256"
          JWT_ALGORITHM = "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES = 30

          SMTP_SERVER = "smtp.example.com"
          SMTP_PORT = 587
          SMTP_USERNAME = "ci@example.com"
          SMTP_PASSWORD = "ci-dummy-password"

          GEMINI_API_KEY = "ci-dummy-key"

          class Settings:
              DATABASE_URL = DATABASE_URL
              SECRET_KEY = SECRET_KEY
              JWT_SECRET_KEY = JWT_SECRET_KEY
              ALGORITHM = ALGORITHM
              JWT_ALGORITHM = JWT_ALGORITHM
              ACCESS_TOKEN_EXPIRE_MINUTES = ACCESS_TOKEN_EXPIRE_MINUTES
              SMTP_SERVER = SMTP_SERVER
              SMTP_PORT = SMTP_PORT
              SMTP_USERNAME = SMTP_USERNAME
              SMTP_PASSWORD = SMTP_PASSWORD
              GEMINI_API_KEY = GEMINI_API_KEY

          settings = Settings()
          EOF

      - name: Run flake8 (syntax errors & undefined names)
        working-directory: backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=__pycache__

      - name: Compile-check all backend Python files
        working-directory: backend
        run: |
          python -m compileall -q .

      - name: Run backend test suite
        working-directory: backend
        run: |
          pip install pytest
          pytest tests -v

  frontend:
    name: Frontend (React/Vite) - Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

