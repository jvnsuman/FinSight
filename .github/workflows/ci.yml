name: CI - Backend & Frontend Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend (FastAPI) - Lint & Compile Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run flake8 (syntax errors & undefined names)
        working-directory: backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=__pycache__

      - name: Compile-check all backend Python files
        working-directory: backend
        run: |
          python -m compileall -q .

      - name: Run backend test suite
        working-directory: backend
        env:
          # backend/config.py has safe defaults for everything except
          # these - DATABASE_URL doesn't need to be a real, reachable
          # database since the test suite runs entirely against an
          # in-memory SQLite fixture (see tests/conftest.py), never the
          # value in this env var.
          DATABASE_URL: "postgresql://ci_user:ci_password@localhost:5432/finsight_ci"
          JWT_SECRET_KEY: "ci-test-secret-key"
          GEMINI_API_KEY: "ci-test-key"
        run: |
          pip install pytest
          pytest tests -v

  frontend:
    name: Frontend (React/Vite) - Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

